<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Multimotion 动作库</title>
  <link rel="stylesheet" href="/ui/static/motion_library.css">
  <link rel="stylesheet" href="/ui/static/taxonomy_tree.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">LOCAL MOTION ATLAS</p>
      <h1>Multimotion 动作库</h1>
    </div>
    <div class="header-meta">
      <span id="statusBadge" class="status-pill">读取中</span>
      <a href="/api/v1/health" target="_blank" rel="noopener">API</a>
    </div>
  </header>

  <main class="workspace">
    <aside class="filters" aria-label="动作筛选">
      <div class="filter-title">
        <div><p class="eyebrow">FILTER</p><h2>分类检索</h2></div>
        <button id="clearFilters" type="button">清空</button>
      </div>
      <label class="search-box" for="searchInput">
        <span>文本搜索</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="握手、拥抱、walk、basketball">
      </label>
      <section>
        <h3>数据集</h3>
        <div id="datasetFilters" class="chip-row"></div>
      </section>
      <section>
        <h3>缓存状态</h3>
        <div id="cacheFilters" class="chip-row"></div>
      </section>
      <div id="taxonomyFilters"></div>
    </aside>

    <section class="results" aria-live="polite">
      <div class="results-head">
        <div><p class="eyebrow">SEARCH RESULTS</p><h2 id="resultTitle">动作结果</h2></div>
        <label>排序
          <select id="sortSelect">
            <option value="relevance">相关度</option>
            <option value="motion_id">Motion ID</option>
            <option value="frame_count_desc">帧数最多</option>
            <option value="cached_first" selected>已缓存优先</option>
          </select>
        </label>
      </div>
      <section id="taxonomyDetail" class="taxonomy-detail hidden" aria-live="polite"></section>
      <div id="resultGrid" class="result-grid"><article class="empty">正在读取动作索引...</article></div>
      <div id="pager" class="pager hidden">
        <button id="prevPage" type="button">上一页</button>
        <span id="pageText"></span>
        <button id="nextPage" type="button">下一页</button>
      </div>
    </section>

    <aside class="viewer-panel" aria-label="GLB 预览">
      <div class="viewer-head">
        <div><p class="eyebrow">GLB PREVIEW</p><h2 id="viewerTitle">选择一个动作</h2></div>
        <a id="downloadLink" class="download-link disabled" href="#">下载</a>
      </div>
      <div id="viewerStatus" class="viewer-status">列表使用轻量预览；点击“播放完整”后按需加载 3D 动作。</div>
      <div id="viewerCanvas" class="viewer-canvas"></div>
      <div id="viewerMeta" class="viewer-meta"></div>
    </aside>
  </main>

  <script type="module" src="/ui/static/motion_library.js"></script>
</body>
</html>
